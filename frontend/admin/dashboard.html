<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar col-md-2 d-none d-md-block">
            <div class="brand">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-shield-lock-fill me-2" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M8 0c-.69 0-1.843.265-2.928.56-1.11.3-2.229.655-2.887.87a1.54 1.54 0 0 0-1.044 1.262c-.596 4.477.787 7.795 2.465 9.99a11.777 11.777 0 0 0 2.517 2.453c.386.273.744.482 1.048.625.28.132.581.24.829.24s.548-.108.829-.24a7.159 7.159 0 0 0 1.048-.625 11.775 11.775 0 0 0 2.517-2.453c1.678-2.195 3.061-5.513 2.465-9.99a1.541 1.541 0 0 0-1.044-1.263 62.467 62.467 0 0 0-2.887-.87C9.843.266 8.69 0 8 0zm0 5a1.5 1.5 0 0 1 .5 2.915l.385 1.99a.5.5 0 0 1-.491.595h-.788a.5.5 0 0 1-.49-.595l.384-1.99A1.5 1.5 0 0 1 8 5z"/>
                </svg>
                Admin Portal
            </div>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="#" class="nav-link active" id="navDashboard">Dashboard</a></li>
                <li class="nav-item"><a href="#" class="nav-link" id="navUsers">Users</a></li>
                <li class="nav-item"><a href="#" class="nav-link" id="navCourses">Courses</a></li>
                <li class="nav-item"><a href="#" class="nav-link" id="navAssignments">Assignments</a></li>
                <li class="nav-item"><a href="#" class="nav-link" id="navStats">Stats</a></li>
                <li class="nav-item mt-5"><a href="#" class="nav-link text-danger" onclick="logout()">Logout</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content col-md-10">
            <div class="page-header">
                <h2 id="pageTitle" class="m-0">Overview</h2>
            </div>
            <div id="contentArea"></div>
        </main>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast align-items-center text-bg-primary border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>
    
    <!-- User Modal -->
    <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="userForm">
              <div class="modal-header">
                <h5 class="modal-title fs-5">Add New User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <div id="userAlert" class="alert d-none small"></div>
                <div class="mb-3">
                    <label class="form-label small">Username</label>
                    <input type="text" class="form-control" id="u_username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small">Full Name</label>
                    <input type="text" class="form-control" id="u_name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small">Password</label>
                    <input type="password" class="form-control" id="u_password" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small">Role</label>
                    <select class="form-select" id="u_role" required>
                        <option value="faculty">Faculty</option>
                        <option value="student">Student</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
              </div>
              <div class="modal-footer border-0">
                <button type="button" class="btn text-muted" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary" id="saveUserBtn">Save User</button>
              </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Course Modal -->
    <div class="modal fade" id="courseModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="courseForm">
              <div class="modal-header">
                <h5 class="modal-title fs-5">Add New Course</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <div id="courseAlert" class="alert d-none small"></div>
                <div class="mb-3">
                    <label class="form-label small">Course Code</label>
                    <input type="text" class="form-control" id="c_code" placeholder="e.g. CS101" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small">Course Name</label>
                    <input type="text" class="form-control" id="c_name" placeholder="e.g. Introduction to Programming" required>
                </div>
              </div>
              <div class="modal-footer border-0">
                <button type="button" class="btn text-muted" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary" id="saveCourseBtn">Save Course</button>
              </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Assignment Modal (Faculty) -->
    <div class="modal fade" id="assignFacultyModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="assignFacultyForm">
              <div class="modal-header">
                <h5 class="modal-title fs-5">Assign Faculty to Course</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <div id="assignFacultyAlert" class="alert d-none small"></div>
                <div class="mb-3">
                    <label class="form-label small">Select Faculty</label>
                    <select class="form-select" id="af_faculty" required></select>
                </div>
                <div class="mb-3">
                    <label class="form-label small">Select Course</label>
                    <select class="form-select" id="af_course" required></select>
                </div>
              </div>
              <div class="modal-footer border-0">
                <button type="button" class="btn text-muted" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary" id="assignFacultyBtn">Assign</button>
              </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Enrollment Modal (Student) -->
    <div class="modal fade" id="enrollStudentModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="enrollStudentForm">
              <div class="modal-header">
                <h5 class="modal-title fs-5">Enroll Student</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <div id="enrollStudentAlert" class="alert d-none small"></div>
                <div class="mb-3">
                    <label class="form-label small">Select Student</label>
                    <select class="form-select" id="es_student" required></select>
                </div>
                <div class="mb-3">
                    <label class="form-label small">Select Course</label>
                    <select class="form-select" id="es_course" required></select>
                </div>
              </div>
              <div class="modal-footer border-0">
                <button type="button" class="btn text-muted" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary" id="enrollStudentBtn">Enroll</button>
              </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-sm">
        <div class="modal-content">
          <div class="modal-body text-center p-4">
            <h5 class="mb-3" id="confirmTitle">Confirm Action</h5>
            <p class="text-muted small mb-4" id="confirmMessage">Are you sure?</p>
            <div class="d-flex justify-content-center gap-2">
                <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmBtn">Confirm</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="admin.js"></script>
</body>
</html>
