<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Dashboard</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar col-md-2 d-none d-md-block">
            <div class="brand">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-person-workspace me-2" viewBox="0 0 16 16">
                  <path d="M4 16s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1H4Zm4-5.95a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/>
                  <path d="M2 1a2 2 0 0 0-2 2v9.5A1.5 1.5 0 0 0 1.5 14h.653a5.373 5.373 0 0 1 1.066-2H1V3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v9h-2.219c.554.654.89 1.373 1.066 2h.653a1.5 1.5 0 0 0 1.5-1.5V3a2 2 0 0 0-2-2H2Z"/>
                </svg>
                Faculty Portal
            </div>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="#" class="nav-link active" id="navStats">Feedback Dashboard</a></li>
                <li class="nav-item mt-5"><a href="#" class="nav-link text-danger" onclick="logout()">Logout</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content col-md-10">
            <div class="page-header d-flex justify-content-between align-items-end">
                <div>
                    <h2 class="m-0">Performance Overview</h2>
                    <p class="text-muted m-0 mt-1">Review student feedback and ratings across your assigned courses.</p>
                </div>
            </div>
            <div id="contentArea"></div>
        </main>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.role !== 'faculty') {
            logout();
        }

        async function loadDashboard() {
            const area = document.getElementById('contentArea');
            area.innerHTML = '<div class="text-center p-5"><div class="spinner-border text-primary" role="status"></div></div>';

            try {
                // Load stats
                const stats = await apiCall('/feedback/stats');
                
                if (stats.length === 0) {
                    area.innerHTML = `
                        <div class="empty-state">
                            <i class="bi bi-graph-up text-primary"></i>
                            <h5 class="mt-3">No Feedback Yet</h5>
                            <p class="text-muted">You have not received any feedback from students in your courses.</p>
                        </div>
                    `;
                    return;
                }

                let html = `
                    <div class="row g-4 mb-5">
                        <div class="col-md-12">
                            <div class="card p-4 border-0">
                                <h5 class="mb-4">Average Ratings by Course</h5>
                                <canvas id="feedbackChart" width="400" height="120"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="m-0">Student Comments</h4>
                    </div>
                    <div id="commentsArea" class="row g-4"></div>
                `;
                area.innerHTML = html;

                const labels = stats.map(s => `${s.course_code} - ${s.course_name}`);
                const teachingData = stats.map(s => parseFloat(s.avg_teaching).toFixed(2));
                const commData = stats.map(s => parseFloat(s.avg_communication).toFixed(2));
                const overallData = stats.map(s => parseFloat(s.avg_overall).toFixed(2));

                const ctx = document.getElementById('feedbackChart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            { label: 'Teaching Quality', data: teachingData, backgroundColor: 'rgba(79, 70, 229, 0.8)', borderRadius: 4 },
                            { label: 'Communication Skills', data: commData, backgroundColor: 'rgba(16, 185, 129, 0.8)', borderRadius: 4 },
                            { label: 'Overall Rating', data: overallData, backgroundColor: 'rgba(139, 92, 246, 0.8)', borderRadius: 4 }
                        ]
                    },
                    options: { 
                        responsive: true,
                        plugins: { legend: { position: 'top' } },
                        scales: { y: { beginAtZero: true, max: 5 } } 
                    }
                });

                // Load comments
                const comments = await apiCall('/feedback/comments');
                const commentsArea = document.getElementById('commentsArea');
                
                if (comments.length === 0) {
                    commentsArea.innerHTML = '<div class="col-12"><div class="text-muted text-center p-4 border rounded">No written comments submitted.</div></div>';
                } else {
                    let commentsHtml = '';
                    comments.forEach(c => {
                        commentsHtml += `
                            <div class="col-md-6">
                                <div class="card h-100 p-4 border-0">
                                    <div class="d-flex justify-content-between align-items-start mb-3">
                                        <h6 class="text-primary-accent fw-bold m-0">${c.course_code}</h6>
                                        <span class="badge bg-light text-dark border">
                                            Teaching: ${c.teaching_rating}/5 | Comm: ${c.communication_rating}/5
                                        </span>
                                    </div>
                                    <p class="text-dark fs-6" style="line-height: 1.6;">"${c.comments}"</p>
                                    <div class="mt-auto pt-3 text-muted small border-top">
                                        Submitted on: ${new Date(c.created_at).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })}
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    commentsArea.innerHTML = commentsHtml;
                }

            } catch (e) {
                area.innerHTML = `<div class="empty-state text-danger">${e.message}</div>`;
            }
        }

        loadDashboard();
    </script>
</body>
</html>
