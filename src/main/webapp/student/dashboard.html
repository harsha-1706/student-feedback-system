<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar col-md-2 d-none d-md-block">
            <div class="brand">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-mortarboard-fill me-2" viewBox="0 0 16 16">
                  <path d="M8.211 2.047a.5.5 0 0 0-.422 0l-7.5 3.5a.5.5 0 0 0 .025.917l7.5 3a.5.5 0 0 0 .372 0L14 7.14V13a1 1 0 0 0-1 1v2h3v-2a1 1 0 0 0-1-1V6.739l.686-.275a.5.5 0 0 0 .025-.917l-7.5-3.5Z"/>
                  <path d="M4.176 9.032a.5.5 0 0 0-.656.327l-.5 1.7a.5.5 0 0 0 .294.605l4.5 1.8a.5.5 0 0 0 .372 0l4.5-1.8a.5.5 0 0 0 .294-.605l-.5-1.7a.5.5 0 0 0-.656-.327L8 10.466 4.176 9.032Z"/>
                </svg>
                Student Portal
            </div>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="#" class="nav-link active" id="navPending">Pending Feedback</a></li>
                <li class="nav-item mt-5"><a href="#" class="nav-link text-danger" onclick="logout()">Logout</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content col-md-10">
            <div class="page-header d-flex justify-content-between align-items-end">
                <div>
                    <h2 class="m-0">Pending Feedback</h2>
                    <p class="text-muted m-0 mt-1">Please provide anonymous feedback for the following courses.</p>
                </div>
            </div>
            <div id="contentArea"></div>
        </main>
    </div>
    
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.role !== 'student') {
            logout();
        }

        async function loadPending() {
            const area = document.getElementById('contentArea');
            area.innerHTML = '<div class="text-center p-5"><div class="spinner-border text-primary" role="status"></div></div>';
            
            try {
                const pending = await apiCall('/feedback/pending');
                if (pending.length === 0) {
                    area.innerHTML = `
                        <div class="empty-state">
                            <i class="bi bi-check-circle text-success" style="font-size: 3rem;"></i>
                            <h5 class="mt-3">All Caught Up!</h5>
                            <p class="text-muted">You have no pending feedback forms to complete.</p>
                        </div>
                    `;
                    return;
                }
                
                let html = '<div class="row g-4">';
                pending.forEach(p => {
                    html += `
                        <div class="col-md-6">
                            <div class="card h-100 p-4 border-0" style="transition: transform 0.2s, box-shadow 0.2s;">
                                <div class="d-flex justify-content-between align-items-start mb-3">
                                    <h6 class="text-primary-accent fw-bold m-0">${p.course_code}</h6>
                                </div>
                                <h5>${p.course_name}</h5>
                                <p class="text-muted mb-4">Faculty: ${p.faculty_name}</p>
                                <a href="feedback-form.html?course_id=${p.course_id}&faculty_id=${p.faculty_id}" class="btn btn-outline-primary mt-auto py-2">
                                    Provide Feedback &rarr;
                                </a>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                area.innerHTML = html;
            } catch (e) {
                area.innerHTML = `<div class="empty-state text-danger">${e.message}</div>`;
            }
        }

        loadPending();
    </script>
</body>
</html>
